<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leaderboard Pro</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap");
    :root {
      --bg: #010209;
      --panel: rgba(255, 255, 255, 0.02);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f3f4ff;
      --muted: #7e8698;
      --accent-cyan: #00f2ff;
      --accent-light: #7ad5ff;
      --accent-violet: #b470ff;
      --accent-green: #4dfdb5;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 20% 25%, rgba(0, 242, 255, 0.12), transparent 40%), #010209;
      color: var(--text);
      font-family: "Outfit", sans-serif;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.25) rgba(3, 3, 3, 0.88);
    }
    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(3, 3, 3, 0.9);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.25);
      border-radius: 999px;
      border: 2px solid rgba(3, 3, 3, 0.85);
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.38);
    }
    .shell {
      width: min(1240px, calc(100vw - 32px));
      margin: 32px auto 40px;
      display: grid;
      gap: 18px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.03);
      padding: 0;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 24px 32px 20px;
    }
    .titleWrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .backBtn {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: border-color 0.2s ease;
    }
    .backBtn:hover {
      border-color: var(--accent-cyan);
    }
    .eyebrow {
      margin: 0;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
    }
    h1 {
      margin: 2px 0 0;
      font-size: clamp(1.6rem, 1.9vw + 1rem, 2.2rem);
    }
    .guild {
      font-size: 12px;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: 999px;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.02);
    }
    .top {
      text-align: center;
      padding: 18px 22px 12px;
    }
    .top h2 {
      margin: 0;
      font-size: clamp(1.8rem, 2.2vw + 0.9rem, 2.6rem);
      font-weight: 800;
    }
    .top p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .filters {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 2px 12px 12px;
    }
    .pill {
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.03);
      color: var(--muted);
      border-radius: 999px;
      padding: 8px 16px;
      font: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .pill.active {
      color: var(--accent-cyan);
      border-color: rgba(0, 242, 255, 0.4);
      background: rgba(0, 242, 255, 0.12);
    }
    .aux {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      padding: 6px 18px 18px;
    }
    .aux select,
    .aux input {
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: #000000;
      color: var(--text);
      padding: 9px 14px;
      outline: none;
    }
    .aux select:hover,
    .aux input:hover {
      border-color: rgba(0, 242, 255, 0.3);
    }
    .aux input::placeholder {
      color: #8e97ad;
    }
    .btn {
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 242, 255, 0.15);
      color: var(--text);
      padding: 10px 20px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .btn:hover {
      background: rgba(0, 242, 255, 0.3);
    }
    .status {
      margin: 0 18px 10px;
      padding: 12px 16px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.02);
      color: var(--muted);
      font-size: 0.85rem;
    }
    .status.error {
      border-color: rgba(248, 113, 113, 0.4);
      color: #f87171;
    }
    .tableWrap {
      overflow-x: auto;
      margin: 0 18px 18px;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      background: rgba(1, 4, 8, 0.75);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }
    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 6px;
      min-width: 620px;
    }
    th,
    td {
      padding: 14px 16px;
      text-align: left;
    }
    th {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    tbody td {
      background: rgba(255, 255, 255, 0.02);
      border-top: 1px solid rgba(255, 255, 255, 0.04);
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }
    tbody td:first-child {
      border-left: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 10px 0 0 10px;
    }
    tbody td:last-child {
      border-right: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 0 10px 10px 0;
    }
    tr.row1 td {
      background: rgba(0, 242, 255, 0.08);
      border-color: rgba(0, 242, 255, 0.3);
    }
    tr.row2 td {
      background: rgba(122, 213, 255, 0.07);
      border-color: rgba(122, 213, 255, 0.2);
    }
    tr.row3 td {
      background: rgba(171, 118, 255, 0.06);
      border-color: rgba(171, 118, 255, 0.1);
    }
    .rank {
      display: inline-flex;
      min-width: 32px;
      justify-content: center;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-family: "JetBrains Mono", monospace;
      padding: 3px 10px;
      background: rgba(255, 255, 255, 0.02);
    }
    .mono {
      font-family: "JetBrains Mono", monospace;
    }
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 26px 14px;
    }
    @media (max-width: 640px) {
      .shell {
        width: calc(100vw - 24px);
        margin-top: 16px;
      }
      .aux {
        flex-direction: column;
        align-items: stretch;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="panel header">
      <div class="titleWrap">
        <button class="backBtn" onclick="closeComponent()" aria-label="Back"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 5L8 12L15 19" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div><p class="eyebrow">Rankings</p><h1>Leaderboard Pro</h1></div>
      </div>
      <div class="guild" id="guild">Guild: -</div>
    </section>

    <section class="panel">
      <div class="top"><h2>Rankings</h2><p id="periodLabel">All Time Leaderboard</p></div>
      <div class="filters" id="periodPills">
        <button class="pill active" data-period="all">All Time</button>
        <button class="pill" data-period="weekly">Weekly</button>
        <button class="pill" data-period="monthly">Monthly</button>
        <button class="pill" data-period="daily">Daily</button>
      </div>
      <div class="aux">
        <select id="metric"><option value="xp">XP</option><option value="messages">Messages</option><option value="streak">Streak</option><option value="voice_minutes">Voice Minutes</option></select>
        <select id="limit"><option value="10">10</option><option value="25" selected>25</option><option value="50">50</option><option value="100">100</option></select>
        <input id="query" placeholder="Search user" />
        <button class="btn" id="apply">Apply</button>
      </div>
      <div id="status" class="status" hidden></div>
      <div class="tableWrap">
        <table>
          <thead><tr><th>Rank</th><th>Member</th><th id="scoreLabel">XP</th><th>Details</th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div id="empty" class="empty" hidden>No data yet. Start chatting to earn points.</div>
    </section>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const guildId = params.get("guild_id");
    document.getElementById("guild").textContent = "Guild: " + (guildId || "missing guild_id");
    const periodPills = document.getElementById("periodPills");
    const statusEl = document.getElementById("status");
    const tbody = document.getElementById("tbody");
    const empty = document.getElementById("empty");
    const scoreLabel = document.getElementById("scoreLabel");
    const periodLabel = document.getElementById("periodLabel");
    const metricSel = document.getElementById("metric");
    const limitSel = document.getElementById("limit");
    const queryIn = document.getElementById("query");
    let currentPeriod = "all";

    function closeComponent(){ if(window.parent&&typeof window.parent.closeComponent==="function") return window.parent.closeComponent(); window.history.back(); }
    function setStatus(msg,e=false){ statusEl.hidden=false; statusEl.textContent=msg; statusEl.className="status"+(e?" error":""); }
    function clearStatus(){ statusEl.hidden=true; }
    async function fetchJSON(url){ const r=await fetch(url,{headers:{"Content-Type":"application/json"}}); const t=await r.text(); let d={}; if(t){try{d=JSON.parse(t);}catch{d={raw:t};}} if(!r.ok) throw new Error(d.error||d.detail||("Request failed: "+r.status)); return d; }
    function n(v){ const x=Number(v); return Number.isFinite(x)?x:0; }

    function normalize(raw){
      const root = raw.data || raw.result || raw || {};
      const rows = [root.entries, root.rows, root.items, root.leaderboard, root.users].find(Array.isArray) || [];
      return rows.map((e,i)=>({
        rank: n(e.rank) || i+1,
        user: e.username || e.display_name || e.name || (e.user && (e.user.username||e.user.name)) || "Unknown",
        score: n(e.value ?? e.score ?? e.points ?? e[metricSel.value] ?? e.xp ?? e.messages ?? e.streak ?? e.voice_minutes),
        detail: [
          e.level !== undefined ? `Lv ${e.level}` : "",
          e.streak !== undefined ? `Streak ${e.streak}` : "",
          e.user_id ? `ID ${e.user_id}` : ""
        ].filter(Boolean).join("&nbsp;&nbsp;&nbsp;&nbsp; • &nbsp;&nbsp;&nbsp;&nbsp;") || "-"
      })).sort((a,b)=>a.rank-b.rank);
    }

    function render(rows){
      tbody.innerHTML = rows.map((r)=>`<tr class="${r.rank===1?"row1":r.rank===2?"row2":r.rank===3?"row3":""}"><td><span class="rank">${r.rank}</span></td><td>${r.user}</td><td class="mono">${r.score.toLocaleString()}</td><td>${r.detail}</td></tr>`).join("");
      empty.hidden = rows.length > 0;
    }

    async function load(){
      if(!guildId) return setStatus("Missing guild_id in query string.", true);
      scoreLabel.textContent = metricSel.value.replace(/_/g, " ");
      const pretty = {all:"All Time",weekly:"Weekly",monthly:"Monthly",daily:"Daily"};
      periodLabel.textContent = `${pretty[currentPeriod] || "All Time"} Leaderboard`;
      setStatus("Loading leaderboard...");
      try {
        const qs = new URLSearchParams({ period: currentPeriod, metric: metricSel.value, limit: limitSel.value, q: queryIn.value.trim() });
        const raw = await fetchJSON(`/api/pro/leaderboard/${encodeURIComponent(guildId)}?` + qs.toString());
        const rows = normalize(raw);
        render(rows);
        if (!rows.length) setStatus("No entries matched your filters."); else clearStatus();
      } catch (e) { tbody.innerHTML = ""; empty.hidden = false; setStatus(e.message || "Failed to load leaderboard.", true); }
    }

    periodPills.querySelectorAll(".pill").forEach((p)=>p.addEventListener("click",()=>{
      periodPills.querySelectorAll(".pill").forEach((x)=>x.classList.remove("active")); p.classList.add("active"); currentPeriod = p.dataset.period || "all"; load();
    }));
    document.getElementById("apply").addEventListener("click", load);
    metricSel.addEventListener("change", load);
    limitSel.addEventListener("change", load);
    let t = null; queryIn.addEventListener("input", ()=>{ clearTimeout(t); t = setTimeout(load, 350); });
    load();
  </script>
</body>
</html>
