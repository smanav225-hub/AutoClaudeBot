<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile Pro - AutoClaude</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap");
    
    :root {
      --bg: #000000;
      --panel: rgba(255, 255, 255, 0.02);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f3f4ff;
      --muted: #7e8698;
      --accent-gold: #c4a35a;
      --accent-cyan: #00f2ff;
      --accent-violet: #a855f7;
    }

    * { box-sizing: border-box; }
    
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: #000 !important;
      color: var(--text);
      font-family: "Outfit", sans-serif;
      overflow-x: hidden;
    }

    /* Simple Black Scrollbar */
    html {
      scrollbar-width: thin !important;
      scrollbar-color: #222 #000 !important;
      background: #000 !important;
    }

    ::-webkit-scrollbar { 
      width: 8px !important; 
      height: 8px !important;
    }
    ::-webkit-scrollbar-track { 
      background: #000 !important; 
    }
    ::-webkit-scrollbar-thumb { 
      background: #222 !important; 
      border-radius: 4px !important; 
      border: 1px solid #000 !important;
    }
    ::-webkit-scrollbar-thumb:hover { 
      background: #333 !important; 
    }

    .shell {
      width: min(800px, calc(100vw - 24px));
      margin: 24px auto 40px;
      display: grid;
      gap: 16px;
    }

    .glass {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      backdrop-filter: blur(20px);
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
    }

    .title-group { display: flex; align-items: center; gap: 14px; }
    
    .back-btn {
      width: 38px; height: 38px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.03);
      color: #fff;
      display: grid; place-items: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .back-btn:hover { border-color: var(--accent-cyan); color: var(--accent-cyan); box-shadow: 0 0 15px rgba(0, 242, 255, 0.15); }

    .eyebrow {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin: 0;
    }
    .main-title {
      font-size: 1.5rem;
      font-weight: 800;
      margin: 0;
      color: #fff;
    }

    /* Important: Z-index and position for overlapping dropdown */
    .controls-container {
      position: relative;
      z-index: 9999; 
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      padding: 16px;
      align-items: end;
    }

    .search-block { display: flex; flex-direction: column; gap: 6px; position: relative; }
    .search-label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); letter-spacing: 0.05em; }
    .search-input {
      background: #0a0a0a;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-input:focus { border-color: var(--accent-cyan); }

    .suggestions {
      position: absolute;
      top: 100%; left: 0; right: 0;
      background: #0a0a0a;
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-top: 6px;
      z-index: 10000;
      max-height: 200px;
      overflow-y: auto;
      box-shadow: 0 20px 50px rgba(0,0,0,1);
    }
    .suggestion {
      padding: 10px 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.02);
    }
    .suggestion:hover { background: rgba(255,255,255,0.03); }
    .suggestion img { width: 24px; height: 24px; border-radius: 6px; }

    .load-btn {
      padding: 10px 24px;
      background: var(--accent-cyan);
      color: #000;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .load-btn:hover { opacity: 0.9; }

    .profile-card { padding: 24px; }
    .identity { display: flex; gap: 20px; align-items: center; margin-bottom: 24px; }
    .avatar {
      width: 100px; height: 100px;
      border-radius: 24px;
      border: 2px solid rgba(255,255,255,0.1);
      object-fit: cover;
      background: #111;
    }
    .user-info h2 { margin: 0; font-size: 2.25rem; font-weight: 800; color: #fff; }
    .user-info p { margin: 4px 0 0; color: var(--muted); font-family: "JetBrains Mono"; font-size: 13px; }

    .badges { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
    .badge {
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(0, 242, 255, 0.08);
      border: 1px solid rgba(0, 242, 255, 0.2);
      color: var(--accent-cyan);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .roles-section {
      margin-bottom: 24px;
    }
    .roles-title {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
      letter-spacing: 0.05em;
    }
    .roles-list {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .role-tag {
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .role-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }
    .stat-box {
      padding: 14px;
      background: rgba(255,255,255,0.01);
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    .stat-box .k { font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--muted); letter-spacing: 0.05em; }
    .stat-box .v { font-size: 1.4rem; font-weight: 800; margin-top: 6px; color: #fff; }

    .xp-section {
      padding: 16px;
      background: rgba(255,255,255,0.01);
      border: 1px solid var(--border);
      border-radius: 16px;
    }
    .xp-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 12px; font-weight: 700; }
    .xp-bar { height: 10px; background: #111; border-radius: 999px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); }
    .xp-fill { height: 100%; background: linear-gradient(90deg, var(--accent-gold), #e0c080); transition: width 1s cubic-bezier(0.4, 0, 0.2, 1); }
    .xp-footer { margin-top: 8px; font-size: 11px; color: var(--muted); font-family: "JetBrains Mono"; }

    .status { padding: 12px; margin: 0 16px; border-radius: 10px; background: rgba(255,255,255,0.02); font-size: 13px; color: var(--muted); }
    .status.error { color: #ff4d4d; border: 1px solid rgba(255,77,77,0.2); }

    @media (max-width: 600px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .controls { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="glass header">
      <div class="title-group">
        <button class="back-btn" onclick="window.parent.closeComponent()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6" /></svg></button>
        <div>
          <p class="eyebrow">Member Intelligence</p>
          <h1 class="main-title">Profile Pro</h1>
        </div>
      </div>
      <div id="guild-tag" style="font-size: 11px; font-weight: 700; color: var(--muted); padding: 6px 12px; border: 1px solid var(--border); border-radius: 999px;">CONNECTING...</div>
    </header>

    <div class="glass controls-container">
      <div class="controls">
        <div class="search-block">
          <span class="search-label">Member Search</span>
          <input type="text" id="userId" class="search-input" placeholder="Enter User ID or search by name..." oninput="handleSearch(this.value)">
          <div id="suggestions" class="suggestions" hidden></div>
        </div>
        <button class="load-btn" onclick="loadProfile()">Load Analytics</button>
      </div>
    </div>

    <div id="status" class="status" hidden></div>

    <article class="glass profile-card">
      <div class="identity">
        <img id="avatar" class="avatar" src="" alt="">
        <div class="user-info">
          <h2 id="name">No User</h2>
          <p id="meta-id">ID: 000000000000000000</p>
          <p id="meta-joined">Joined: --/--/----</p>
        </div>
      </div>

              <div id="badges" class="badges"></div>
      
              <div class="roles-section">
                <div class="roles-title">Roles</div>
                <div id="roles-list" class="roles-list"></div>
              </div>
      
              <div class="stats-grid" id="stats">        <div class="stat-box"><div class="k">Rank</div><div class="v" id="stat-rank">-</div></div>
        <div class="stat-box"><div class="k">Level</div><div class="v" id="stat-level">0</div></div>
        <div class="stat-box"><div class="k">Reputation</div><div class="v" id="stat-rep">0</div></div>
        <div class="stat-box"><div class="k">Messages</div><div class="v" id="stat-msgs">0</div></div>
        <div class="stat-box"><div class="k">Streak</div><div class="v" id="stat-streak">0</div></div>
        <div class="stat-box"><div class="k">Best Streak</div><div class="v" id="stat-best">0</div></div>
        <div class="stat-box" style="grid-column: span 2;"><div class="k">Total Experience</div><div class="v" id="stat-xp">0 XP</div></div>
      </div>

      <div class="xp-section">
        <div class="xp-header">
          <span id="lv-start">Level 0</span>
          <span id="lv-end">Level 1</span>
        </div>
        <div class="xp-bar"><div id="xp-fill" class="xp-fill" style="width: 0%"></div></div>
        <div class="xp-footer" id="xp-text">0 / 0 XP (0%)</div>
      </div>
    </article>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const guildId = params.get('guild_id');
    const qUser = params.get('user_id');
    
    if (guildId) document.getElementById('guild-tag').textContent = `GUILD: ${guildId}`;
    if (qUser) document.getElementById('userId').value = qUser;

    function setStatus(msg, isError = false) {
      const el = document.getElementById('status');
      el.hidden = !msg;
      el.textContent = msg;
      el.className = `status ${isError ? 'error' : ''}`;
    }

    async function fetchJSON(url) {
      const res = await fetch(url);
      const data = await res.json();
      if (!res.ok || data.success === false) throw new Error(data.error || 'Request failed');
      return data;
    }

    let searchTimer = null;
    function handleSearch(q) {
      clearTimeout(searchTimer);
      if (q.length < 2) {
        document.getElementById('suggestions').hidden = true;
        return;
      }
      searchTimer = setTimeout(async () => {
        try {
          const data = await fetchJSON(`/api/pro/profile/${guildId}/search?q=${encodeURIComponent(q)}&limit=5`);
          const sug = document.getElementById('suggestions');
          sug.innerHTML = data.rows.map(u => `
            <div class="suggestion" onclick="selectUser('${u.user_id}', '${u.username}')">
              <img src="${u.avatar_url || ''}" onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'">
              <div>
                <div style="font-weight:700; font-size:13px; color:#fff;">${u.username}</div>
                <div style="font-size:11px; color:#555;">Lv ${u.level} • ${u.xp_total.toLocaleString()} XP</div>
              </div>
            </div>
          `).join('');
          sug.hidden = data.rows.length === 0;
        } catch (e) { console.error(e); }
      }, 300);
    }

    function selectUser(id, name) {
      document.getElementById('userId').value = id;
      document.getElementById('suggestions').hidden = true;
      loadProfile();
    }

    async function loadProfile() {
      const uid = document.getElementById('userId').value.trim();
      if (!uid || !guildId) return;
      
      setStatus("Querying database & Discord API...");
      try {
        const data = await fetchJSON(`/api/pro/profile/${guildId}/${uid}`);
        const p = data.profile;
        
        // Identity
        document.getElementById('name').textContent = p.username;
        document.getElementById('meta-id').textContent = `ID: ${p.id}`;
        document.getElementById('meta-joined').textContent = `Joined: ${p.joined_at ? new Date(p.joined_at).toLocaleDateString() : 'N/A'}`;
        const av = document.getElementById('avatar');
        av.src = p.avatar_url;
        av.onerror = () => av.src = 'https://cdn.discordapp.com/embed/avatars/0.png';

        // Badges
        document.getElementById('badges').innerHTML = p.badges.map(b => `<span class="badge">${b}</span>`).join('');

        // Roles
        const rolesList = document.getElementById('roles-list');
        if (p.roles && p.roles.length > 0) {
          rolesList.innerHTML = p.roles.map(r => `
            <div class="role-tag">
              <div class="role-dot" style="background-color: ${r.color}"></div>
              <span style="color: ${r.color}">${r.name}</span>
            </div>
          `).join('');
        } else {
          rolesList.innerHTML = '<span style="color:var(--muted); font-size:11px;">No roles found</span>';
        }

        // Stats
        document.getElementById('stat-rank').textContent = p.rank ? `#${p.rank}` : 'N/A';
        document.getElementById('stat-level').textContent = p.level;
        document.getElementById('stat-rep').textContent = p.reputation;
        document.getElementById('stat-msgs').textContent = p.messages_total.toLocaleString();
        document.getElementById('stat-streak').textContent = p.streak_current;
        document.getElementById('stat-best').textContent = p.streak_best;
        document.getElementById('stat-xp').textContent = `${p.xp_total.toLocaleString()} XP`;

        // XP Bar
        document.getElementById('lv-start').textContent = `Level ${p.level}`;
        document.getElementById('lv-end').textContent = `Level ${p.level + 1}`;
        const pct = Math.round(p.xp_progress * 100);
        document.getElementById('xp-fill').style.width = `${pct}%`;
        document.getElementById('xp-text').textContent = `${p.xp_current.toLocaleString()} / ${p.xp_to_next_level.toLocaleString()} XP (${pct}%)`;

        setStatus("");
      } catch (e) {
        setStatus(e.message, true);
      }
    }

    if (qUser) loadProfile();
  </script>
</body>
</html>
